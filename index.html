<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مستوصف الهلال الأحمر العربي السوري – دير حافر</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#faf6f6;--card:#fff;--ink:#2b1a1a;--mut:#7a6262;--line:#ecd9d9;--pri:#c1121f;--pri-ink:#fff;--soft:#fbe6e6;--bad:#8f1018;--dis:#efe9e9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1213;--card:#271a1b;--ink:#f5e9ea;--mut:#b79c9e;--line:#422b2d;--pri:#ff7a80;--pri-ink:#2a0709;--soft:#3a2124;--bad:#ffb0b4;--dis:#301f21;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1213;--card:#271a1b;--ink:#f5e9ea;--mut:#b79c9e;--line:#422b2d;--pri:#ff7a80;--pri-ink:#2a0709;--soft:#3a2124;--bad:#ffb0b4;--dis:#301f21;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:520px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}.logo{width:64px;height:64px;border-radius:50%;background:#fff;flex:0 0 auto}.sub{color:var(--mut);font-size:14px}
h1{font-size:19px;line-height:1.3;font-weight:800;margin:0}
h2{font-size:18px;margin:16px 0 8px}
.tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:12px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:700;padding:10px;border-radius:9px}
.tabs button.on{background:var(--card);color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
label{display:block;font-weight:700;margin:10px 0 4px}
input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=tel]{direction:ltr;text-align:right}
.btn{width:100%;border:0;background:var(--pri);color:var(--pri-ink);font:inherit;font-weight:800;padding:14px;border-radius:12px;margin-top:14px}
.btn.alt{background:var(--soft);color:var(--pri)}
.btn:disabled{opacity:.4}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.clinic{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;padding:16px 8px;border-radius:12px;text-align:center}
.clinic .e{font-size:26px;display:block}
.clinic.on,.chip.on{border-color:var(--pri);background:var(--soft);color:var(--pri)}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:8px 12px;border-radius:10px;text-align:center;min-width:68px}
.chip small{display:block;color:var(--mut)}
.chip:disabled{background:var(--dis);color:var(--mut);text-decoration:line-through}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slots .chip{min-width:0;padding:10px 4px;direction:ltr}
.bk{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:10px 0}
.bk:last-child{border:0}
.bk b{display:block}.bk span{color:var(--mut);font-size:14px}
a.x{text-decoration:none}.x{border:0;background:none;color:var(--bad);font:inherit;font-weight:700;padding:6px}
.ok{text-align:center}.ok .big{font-size:44px}
.err{color:var(--bad);font-weight:700;margin:8px 0 0;min-height:1.4em}
.empty{color:var(--mut);text-align:center;padding:16px 0}
.steps{color:var(--mut);font-size:14px;margin-bottom:8px}
</style>
</head>

 return h}
function s1(){var n=document.getElementById('nm').value.trim(),p=fix(document.getElementById('ph').value);S.name=n;S.phone=p;
 if(!n){S.err='اكتب اسم المريض';return render()}
 if(p.length<9||p.length>12){S.err='رقم الجوال غير صحيح، اكتبه كاملًا';return render()}
 S.err='';S.step=2;render()}
function pick(i){S.clinic=CL[i].n;S.date=null;S.time=null;S.step=3;render()}
function confirmBk(){
 if(taken(S.clinic,S.date,S.time)){S.err='هذا الوقت حُجز للتو، اختر وقتًا آخر';S.time=null;return render()}
 var dup=B.some(function(b){return b.phone===S.phone&&b.clinic===S.clinic&&b.date===S.date});
 if(dup){S.err='لديك حجز في نفس العيادة في هذا اليوم';return render()}
 var b={id:Date.now(),phone:S.phone,name:S.name,clinic:S.clinic,date:S.date,time:S.time};B.push(b);save();S.done=b;render()}
function mineView(){
 var h='<div class="card"><label for="mp">رقم الجوال</label><input id="mp" type="tel" inputmode="tel" value="'+S.mPhone+'" placeholder="05xxxxxxxx"><button class="btn" onclick="S.mPhone=fix(document.getElementById(\'mp\').value);S.mShown=true;render()">عرض مواعيدي</button></div>';
 if(S.mShown){var l=B.filter(function(b){return b.phone===S.mPhone}).sort(cmp);
  h+='<div class="card">'+(l.length?l.map(function(b){return row(b,true)}).join(''):'<div class="empty">لا توجد مواعيد على هذا الرقم</div>')+'</div>'}
 return h}
function cmp(a,b){return (a.date+a.time).localeCompare(b.date+b.time)}
function row(b,showName){return '<div class="bk"><div><b>'+b.clinic+'</b><span>'+fmt(b.date)+' — '+b.time+(showName?'':' · '+b.name+' · <bdi>'+b.phone+'</bdi>')+'</span></div><div>'+(showName?'':'<a class="x" target="_blank" rel="noopener" href="'+waLink(b,true)+'">تأكيد واتساب</a>')+'<button class="x" onclick="cancel('+b.id+')">إلغاء</button></div></div>'}
function cancel(id){if(!confirm('إلغاء هذا الموعد؟'))return;B=B.filter(function(b){return b.id!==id});save();render()}
function staffView(){
 if(!S.staff)return '<div class="card"><label for="pin">رمز الموظف</label><input id="pin" type="tel" inputmode="numeric" placeholder="اكتب الرمز"><p class="err">'+S.err+'</p><button class="btn" onclick="if(document.getElementById(\'pin\').value===PIN){S.staff=true;S.err=\'\'}else{S.err=\'الرمز غير صحيح\'};render()">دخول</button></div>';
 var l=B.filter(function(b){return(!S.fClinic||b.clinic===S.fClinic)&&(!S.fDate||b.date===S.fDate)}).sort(cmp);
 var opts='<option value="">كل العيادات</option>'+CL.map(function(c){return '<option'+(S.fClinic===c.n?' selected':'')+'>'+c.n+'</option>'}).join('');
 return '<div class="card"><div class="grid"><div><label for="fc">العيادة</label><select id="fc" onchange="S.fClinic=this.value;render()" style="width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">'+opts+'</select></div><div><label for="fd">اليوم</label><input id="fd" type="date" value="'+S.fDate+'" onchange="S.fDate=this.value;render()"></div></div></div><div class="card"><b>'+l.length+' حجز</b>'+(l.length?l.map(function(b){return row(b,false)}).join(''):'<div class="empty">لا توجد حجوزات</div>')+'</div>'}
if(location.hash==='#staff')document.getElementById('t-s').style.display='';
render();
</script>
